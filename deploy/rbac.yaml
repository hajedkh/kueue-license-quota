apiVersion: v1
kind: ServiceAccount
metadata: { name: license-quota-reconciler, namespace: kueue-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: license-quota-reconciler }
rules:
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["clusterqueues"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: license-quota-reconciler }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: license-quota-reconciler }
subjects:
- { kind: ServiceAccount, name: license-quota-reconciler, namespace: kueue-system }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: license-quota-reconciler, namespace: kueue-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: license-quota-reconciler } }
  template:
    metadata: { labels: { app: license-quota-reconciler } }
    spec:
      serviceAccountName: license-quota-reconciler
      containers:
      - name: reconciler
        image: ghcr.io/YOUR_GITHUB_USER/kueue-license-quota:0.1.0
        args:
        - --prometheus-url=http://prometheus-k8s.monitoring:9090
        - --cluster-queue=licensed-compute
        - --flavor=default
        - --resource=licenses.example.com/fep
        - --kueue-api-version=v1beta1
        - --interval=30s
        - --stale-after=2m
        resources:
          requests: { cpu: 20m, memory: 32Mi }
